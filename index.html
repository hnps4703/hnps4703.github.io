<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#f4f5f7">

    <meta name="color-scheme"
          content="light dark">

    <title>阿懋｜營輔導長的數位名片</title>


    <style>

        /* =========================
           基本設定
        ========================= */

        * {
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            background: #f4f5f7;

            color: #222;

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }



        /* =========================
           主要容器
        ========================= */

        .container {

            width: 100%;

            max-width: 480px;

            margin: 0 auto;

            padding:
                18px
                20px
                26px;
        }



        /* =========================
           個人資料
        ========================= */

        .profile {

            text-align: center;

            margin-bottom: 22px;
        }



        /* =========================
           Q版頭像
        ========================= */

        .avatar {

            width: 175px;

            height: 175px;

            margin:
                0 auto 13px;

            border-radius: 50%;

            object-fit: contain;

            background: #ffffff;

            box-shadow:
                0 7px 24px rgba(0,0,0,0.10);

            border:
                4px solid rgba(255,255,255,0.95);

            display: block;
        }



        /* =========================
           姓名
        ========================= */

        .profile h1 {

            margin: 0;

            font-size: 38px;

            font-weight: 700;

            letter-spacing: 6px;

            line-height: 1.25;
        }



        /* =========================
           職稱
        ========================= */

        .profile .job {

            margin-top: 7px;

            font-size: 19px;

            font-weight: 500;

            color: #666;

            line-height: 1.4;
        }



        /* =========================
           單位
        ========================= */

        .profile .welcome {

            margin-top: 10px;

            font-size: 15px;

            color: #888;

            letter-spacing: 1px;

            line-height: 1.5;
        }



        /* =========================
           聯絡方式標題
        ========================= */

        .section-title {

            display: flex;

            align-items: center;

            margin:
                18px
                0
                11px;

            font-size: 17px;

            font-weight: 600;

            color: #777;

            letter-spacing: 1px;
        }


        .section-title::before,
        .section-title::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #dfe2e5;
        }


        .section-title span {

            padding:
                0
                14px;
        }



        /* =========================
           聯絡方塊
        ========================= */

        .link-button {

            display: grid;

            grid-template-columns:
                46px
                1fr
                46px;

            align-items: center;

            width: 100%;

            min-height: 76px;

            margin:
                12px
                0;

            padding:
                10px
                16px;

            background: #ffffff;

            color: #222;

            text-decoration: none;

            border-radius: 17px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.07);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.3s ease;

            font-size: 20px;

            font-weight: 600;
        }



        /* =========================
           滑鼠移入
        ========================= */

        .link-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 22px rgba(0,0,0,0.11);
        }



        /* =========================
           點擊效果
        ========================= */

        .link-button:active {

            transform:
                scale(0.98);
        }



        /* =========================
           左側圖示
        ========================= */

        .icon {

            width: 46px;

            height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

            line-height: 1;

            justify-self: center;
        }



        /* =========================
           按鈕文字
           真正水平＋垂直置中
        ========================= */

        .button-text {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            height: 100%;

            text-align: center;

            line-height: 1.3;

            white-space: nowrap;
        }



        /* =========================
           右側箭頭
        ========================= */

        .arrow {

            width: 46px;

            height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            color: #999;

            line-height: 1;

            justify-self: center;
        }



        /* =========================
           頁尾
        ========================= */

        .footer {

            margin-top: 30px;

            text-align: center;

            font-size: 10px;

            line-height: 1.7;

            color: #aaa;

            letter-spacing: 0.5px;
        }



        /* =========================
           深色模式
        ========================= */

        @media (prefers-color-scheme: dark) {

            body {

                background: #15171a;

                color: #f3f3f3;
            }



            /* Q版維持白色圓形背景 */

            .avatar {

                background: #ffffff;

                border-color: #303338;

                box-shadow:
                    0 7px 24px rgba(0,0,0,0.40);
            }



            .profile .job {

                color: #b5b5b5;
            }



            .profile .welcome {

                color: #888;
            }



            .section-title {

                color: #999;
            }



            .section-title::before,
            .section-title::after {

                background: #34373b;
            }



            .link-button {

                background: #24272b;

                color: #f3f3f3;

                box-shadow:
                    0 5px 18px rgba(0,0,0,0.28);
            }



            .link-button:hover {

                background: #2b2e33;

                box-shadow:
                    0 8px 24px rgba(0,0,0,0.38);
            }



            .arrow {

                color: #777;
            }



            .footer {

                color: #666;
            }

        }



        /* =========================
           小螢幕最佳化
        ========================= */

        @media (max-width: 360px) {

            .container {

                padding-left: 16px;

                padding-right: 16px;
            }



            .avatar {

                width: 145px;

                height: 145px;
            }



            .profile h1 {

                font-size: 31px;

                letter-spacing: 4px;
            }



            .profile .job {

                font-size: 17px;
            }



            .profile .welcome {

                font-size: 13px;
            }



            .section-title {

                font-size: 16px;
            }



            .link-button {

                grid-template-columns:
                    42px
                    1fr
                    42px;

                min-height: 70px;

                font-size: 18px;

                padding:
                    9px
                    12px;
            }



            .icon {

                width: 42px;

                height: 42px;

                font-size: 23px;
            }



            .arrow {

                width: 42px;

                height: 42px;

                font-size: 25px;
            }



            .footer {

                margin-top: 25px;

                font-size: 9px;
            }

        }

    </style>

</head>



<body>


    <main class="container">


        <!-- =====================
             個人資訊
        ====================== -->

        <section class="profile">


            <!--
                Q版頭像：
                avatar.jpg

                與 index.html
                放在同一層
            -->

            <img
                class="avatar"
                src="avatar.jpg"
                alt="阿懋 Q版頭像"
            >


            <h1>
                陳昆懋
            </h1>


            <div class="job">
                營輔導長
            </div>


            <div class="welcome">
                陸軍步兵第二五七旅步四營
            </div>


        </section>



        <!-- =====================
             聯絡方式
        ====================== -->

        <div class="section-title">

            <span>
                📱 聯絡方式
            </span>

        </div>



        <!-- =====================
             LINE
        ====================== -->

        <a
            class="link-button"

            href="https://line.me/ti/p/zoSD_ETxjR"

            target="_blank"

            rel="noopener noreferrer"
        >

            <div class="icon">
                💬
            </div>


            <div class="button-text">
                LINE 加好友
            </div>


            <div class="arrow">
                ›
            </div>

        </a>



        <!-- =====================
             電話
        ====================== -->

        <a
            class="link-button"

            href="tel:+886985575198"
        >

            <div class="icon">
                ☎️
            </div>


            <div class="button-text">
                聯絡電話
            </div>


            <div class="arrow">
                ›
            </div>

        </a>



        <!-- =====================
             Email
        ====================== -->

        <a
            class="link-button"

            href="mailto:hnps4703@gmail.com"
        >

            <div class="icon">
                ✉️
            </div>


            <div class="button-text">
                Email
            </div>


            <div class="arrow">
                ›
            </div>

        </a>



        <!-- =====================
             頁尾
        ====================== -->

        <footer class="footer">

            Digital Contact Card<br>

            © 阿懋

        </footer>


    </main>


</body>

</html>
