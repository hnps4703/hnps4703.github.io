<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#f5f6f7">
<meta name="color-scheme" content="light dark">

<title>阿懋｜營輔導長的數位名片</title>

    <style>

        /* =========================
           基本設定
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            background: #f4f5f7;
            color: #222;

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }


        /* =========================
           主要容器
        ========================= */

        .container {
            width: 100%;
            max-width: 480px;

            margin: 0 auto;

            padding:
                42px
                20px
                40px;
        }


        /* =========================
           個人資料
        ========================= */

        .profile {
            text-align: center;
            margin-bottom: 32px;
        }


        /* Q版頭像 */

.avatar {
    width: 110px;
    height: 110px;

    margin: 0 auto 18px;

    border-radius: 50%;

    object-fit: contain;

    background: #ffffff;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);

    border: 4px solid rgba(255,255,255,0.9);
}

        .profile h1 {
            margin: 0;

            font-size: 29px;
            font-weight: 700;

            letter-spacing: 3px;
        }


        .profile .job {
            margin-top: 9px;

            font-size: 15px;

            color: #666;
        }


        .profile .welcome {
            margin-top: 17px;

            font-size: 13px;

            color: #888;

            letter-spacing: 1px;
        }


        /* =========================
           區塊標題
        ========================= */

        .section-title {
            display: flex;

            align-items: center;

            margin:
                24px
                0
                12px;

            font-size: 14px;

            font-weight: 600;

            color: #777;

            letter-spacing: 1px;
        }


        .section-title::before,
        .section-title::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #dfe2e5;
        }


        .section-title span {
            padding:
                0
                12px;
        }


        /* =========================
           按鈕
        ========================= */

        .link-button {

            display: flex;

            align-items: center;

            width: 100%;

            min-height: 62px;

            margin:
                11px
                0;

            padding:
                14px
                18px;

            background: #ffffff;

            color: #222;

            text-decoration: none;

            border-radius: 15px;

            box-shadow:
                0 4px 16px rgba(0,0,0,0.06);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.3s ease;

            font-size: 16px;

            font-weight: 600;
        }


        .link-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 7px 20px rgba(0,0,0,0.10);
        }


        .link-button:active {

            transform:
                scale(0.98);
        }


        .icon {

            width: 34px;
            height: 34px;

            margin-right: 12px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 20px;

            flex-shrink: 0;
        }


        .button-text {
            flex: 1;
        }


        .arrow {

            font-size: 21px;

            color: #999;
        }


        /* =========================
           頁尾
        ========================= */

        .footer {

            margin-top: 38px;

            text-align: center;

            font-size: 11px;

            line-height: 1.8;

            color: #999;

            letter-spacing: 0.5px;
        }


        /* =========================
           深色模式
        ========================= */

        @media (prefers-color-scheme: dark) {

            body {

                background: #15171a;

                color: #f3f3f3;
            }


            .avatar {

                background: #24272b;

                border-color: #303338;

                box-shadow:
                    0 5px 20px rgba(0,0,0,0.35);
            }


            .profile .job {

                color: #b5b5b5;
            }


            .profile .welcome {

                color: #888;
            }


            .section-title {

                color: #999;
            }


            .section-title::before,
            .section-title::after {

                background: #34373b;
            }


            .link-button {

                background: #24272b;

                color: #f3f3f3;

                box-shadow:
                    0 4px 16px rgba(0,0,0,0.25);
            }


            .link-button:hover {

                background: #2b2e33;

                box-shadow:
                    0 7px 20px rgba(0,0,0,0.35);
            }


            .arrow {

                color: #777;
            }


            .footer {

                color: #777;
            }
        }


        /* =========================
           小螢幕最佳化
        ========================= */

        @media (max-width: 360px) {

            .container {

                padding-left: 16px;
                padding-right: 16px;
            }


            .avatar {

                width: 96px;
                height: 96px;
            }


            .profile h1 {

                font-size: 26px;
            }


            .link-button {

                min-height: 58px;

                font-size: 15px;
            }
        }

    </style>
</head>


<body>

    <main class="container">


        <!-- =====================
             個人資訊
        ====================== -->

        <section class="profile">

            <!--
    Q版頭像：
    avatar.jpg

    與 index.html 放在同一層
              -->

            <img
                class="avatar"
                src="avatar.jpg"
                alt="阿懋 Q版頭像"
            >

            <h1>陳昆懋</h1>

            <div class="job">
                營輔導長
            </div>

            <div class="welcome">
                陸軍步兵第二五七旅步四營
            </div>

        </section>



        <!-- =====================
             聯絡方式
        ====================== -->

        <div class="section-title">
            <span>📱 聯絡方式</span>
        </div>


        <!-- LINE -->

        <a
            class="link-button"
            href="https://line.me/ti/p/zoSD_ETxjR"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="icon">
                💬
            </div>

            <div class="button-text">
                LINE 加好友
            </div>

            <div class="arrow">
                ›
            </div>

        </a>



        <!-- 電話 -->

        <a
            class="link-button"
            href="tel:+886985575198"
        >

            <div class="icon">
                📞
            </div>

            <div class="button-text">
                聯絡電話
            </div>

            <div class="arrow">
                ›
            </div>

        </a>



        <!-- Email -->

        <a
            class="link-button"
            href="mailto:hnps4703@gmail.com"
        >

            <div class="icon">
                ✉️
            </div>

            <div class="button-text">
                Email
            </div>

            <div class="arrow">
                ›
            </div>

        </a>



        <!-- =====================
             頁尾
        ====================== -->

        <footer class="footer">

            Digital Contact Card<br>

            © 阿懋

        </footer>


    </main>

</body>
</html>
